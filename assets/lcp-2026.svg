  <polygon points="44,24 84,24 104,38 24,38" fill="#78350F" stroke="#000" stroke-width="2"/>

  <!-- Cutaway 2-Story Pixel House -->
  <rect x="28" y="38" width="72" height="50" fill="#E2E8F0" stroke="#000" stroke-width="2"/>
  <line x1="28" y1="63" x2="100" y2="63" stroke="#92400E" stroke-width="3"/>
  <!-- Window & Fireplace -->
  <rect x="36" y="44" width="14" height="12" fill="#38BDF8" stroke="#000" stroke-width="1.5"/>
  <rect x="36" y="69" width="14" height="19" fill="#991B1B" stroke="#000" stroke-width="1.5"/>
  <polygon points="39,87 43,78 47,87" fill="#FACC15"/>

  <!-- Fair Caucasian Little Computer Person Waving! -->
  <rect x="64" y="45" width="12" height="4" rx="1" fill="#684022"/>
