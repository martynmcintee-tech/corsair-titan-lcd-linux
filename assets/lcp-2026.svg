  <rect x="66" y="52" width="2" height="2.5" fill="#000"/>
  <rect x="72" y="52" width="2" height="2.5" fill="#000"/>
  <rect x="62" y="60" width="16" height="14" rx="2" fill="#38BDF8" stroke="#000" stroke-width="1.5"/>
  <!-- Waving arm -->
  <rect x="78" y="53" width="5" height="10" rx="2" fill="#F8D2B6" stroke="#000" stroke-width="1.5"/>
  <rect x="64" y="74" width="5" height="13" fill="#1E3A8A" stroke="#000" stroke-width="1.5"/>
  <rect x="71" y="74" width="5" height="13" fill="#1E3A8A" stroke="#000" stroke-width="1.5"/>

