      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="65%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- Circular Bezel -->
  <circle cx="64" cy="64" r="61" fill="#090D16" stroke="#6366F1" stroke-width="4"/>
  <circle cx="64" cy="64" r="55" fill="url(#sky)" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Lawn -->
  <path d="M 14 90 Q 64 90 114 90 A 55 55 0 0 1 14 90 Z" fill="#22C55E"/>
  <rect x="15" y="88" width="98" height="5" rx="2" fill="#4ADE80"/>

